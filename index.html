<!DOCTYPE html>
<html>
<head>
  <title>Aplikasi Penilaian Rumah Sehat</title>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbysiLv-IhaxzvI1gn8p69r9Q6rRFmz9y3242W42aFn1rPDSbEsSZ6bw6ecBw3AT6JqE/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
